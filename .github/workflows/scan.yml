name: Market Radar Scan

on:
  workflow_dispatch: {}       # triggered externally (cron-job.org -> GitHub API)
                               # or manually from the Actions tab.
  # v17 (22/9/2026): the internal `schedule: cron:` trigger was removed.
  # GitHub's own scheduler was found to be unreliable at high frequency for
  # this repo - 15-minute schedules were firing every 2-5 hours instead
  # (confirmed from the Actions run history: gaps of 2h29m, 5h+ between
  # consecutive "Scheduled" runs, despite Actions being fully enabled and
  # no repo-inactivity auto-disable in play). This is documented, known
  # GitHub Actions behavior under platform load - not something fixable
  # from inside this workflow file. The fix: an external scheduler
  # (cron-job.org) now calls this workflow's `workflow_dispatch` trigger
  # directly via the GitHub REST API on a real, guaranteed schedule,
  # removing GitHub's own scheduler from the critical path entirely.

permissions:
  contents: write

# v15: a run takes ~21-30+ minutes, so a new run must WAIT for the current
# one to finish instead of racing it. cancel-in-progress is false on
# purpose: killing a run mid-write is worse than a short queue - a
# cancelled run can leave partial file writes if stopped between scripts.
concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner (price history + indicators + categories + breadth)
        run: python scripts/scan.py

      - name: Check Binance liquidity for candidates
        run: python scripts/check_liquidity.py

      - name: Check resistance breakouts + fibonacci extensions + retests (rotating)
        run: python scripts/breakout_check.py

      - name: Auto paper trades + shadow log
        run: python scripts/auto_paper_trade.py

      - name: Scalp/momentum signals (data-collection track)
        run: python scripts/scalp_signals.py

      - name: Check open trades against latest prices + update performance summary
        run: python scripts/track_trades.py

      - name: Evaluate past signals against current prices
        run: python scripts/evaluate_signals.py

      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/ config/
          git diff --quiet --cached || git commit -m "radar: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
