name: Market Radar Scan

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

# v15 (22/9/2026): a run takes ~21 minutes but was scheduled every 15, so a
# new run was starting before the previous one finished - the real reason
# the commit step needed a 5-attempt rebase-and-retry loop below. This makes
# a queued run WAIT for the current one to finish instead of running in
# parallel against the same data/ and config/ files. cancel-in-progress is
# false on purpose: killing a run mid-write is worse than a short queue -
# a cancelled run can leave partial file writes if it's stopped between
# scripts.
concurrency:
  group: radar-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner (price history + indicators + categories + breadth)
        run: python scripts/scan.py

      - name: Check Binance liquidity for candidates
        run: python scripts/check_liquidity.py

      - name: Check resistance breakouts + fibonacci extensions + retests (rotating)
        run: python scripts/breakout_check.py

      - name: Auto paper trades + shadow log
        run: python scripts/auto_paper_trade.py

      - name: Scalp/momentum signals (data-collection track)
        run: python scripts/scalp_signals.py

      - name: Check open trades against latest prices + update performance summary
        run: python scripts/track_trades.py

      - name: Evaluate past signals against current prices
        run: python scripts/evaluate_signals.py

      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/ config/
          git diff --quiet --cached || git commit -m "radar: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
