name: Market Radar Scan

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner (price history + indicators + categories)
        run: python scripts/scan.py

      - name: Check Binance liquidity for candidates
        run: python scripts/check_liquidity.py

      - name: Check resistance breakouts (Binance-listed only, rotating)
        run: python scripts/breakout_check.py

      - name: Check open trades against latest prices + update performance summary
        run: python scripts/track_trades.py

      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/market-scan.json data/radar-flags.json data/price-history.json data/indicators.json data/categories.json data/performance-summary.json data/breakout-rotation-state.json config/trades.json
          git diff --quiet --cached || git commit -m "radar: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
