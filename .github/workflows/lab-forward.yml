name: Lab - forward test (T4-B)

# RC-1.3 cycle-1 decision (4 Oct 2026): monthly replay of each NEW month from the
# Binance public archive with the exact backtest definitions. Runs on the 4th of
# every month for the month before (funding files are monthly). First month: 2026-10.
on:
  schedule:
    - cron: "0 5 4 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (empty = previous month)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - name: Replay the month
        run: python scripts/lab/forward_t4.py ${{ inputs.month }}
      - name: Commit ledger
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          if [ -d data/lab/forward ]; then git add data/lab/forward; fi
          git diff --quiet --cached || git commit -m "lab: forward T4-B $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 10 + 5)); done
