name: Lab - data probe

# Research Contract RC-1.1, section 2: first build step. Manual only.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar-scan            # same group as the scanner: never pushes at the same time
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe data access and coverage
        run: python scripts/lab/probe_data.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/lab/
          git diff --quiet --cached || git commit -m "lab: data probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
