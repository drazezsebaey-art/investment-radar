name: Lab - engine

# RC-1.3 steps 3-4. Manual only.
#   calendar : build data/lab/macro-calendar.json from FRED (run once, then frozen)
#   gate     : lab validation replay of the real scalp trades -> data/lab/gate-replay.json
#   tests    : all lab unit tests (incl. real-lake leakage tests)
on:
  workflow_dispatch:
    inputs:
      task:
        description: "calendar | gate | tests"
        default: "tests"
        required: true

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - name: Macro calendar
        if: inputs.task == 'calendar'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/lab/build_macro_calendar.py
      - name: Lab validation gate (replay)
        if: inputs.task == 'gate'
        run: python scripts/lab/replay_gate.py data/scalp-trades.json next_hour
      - name: Tests
        if: inputs.task == 'tests'
        run: |
          mkdir -p lake
          for f in spot-1d-all.tar.gz spot-1h-2022.tar.gz; do
            curl -sL -o lake/$f https://github.com/drazezsebaey-art/investment-radar/releases/download/data-lake-v1/$f
          done
          python -m unittest discover -s tests -p "test_engine_*.py" -v
          python -m unittest tests/test_lab_lake.py -v
      - name: Commit outputs
        if: inputs.task != 'tests'
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data/lab/macro-calendar.json data/lab/gate-replay.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "lab: ${{ inputs.task }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 10 + 5)); done
